<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Teacher Marks | Eastern Public School</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
  body{margin:0;background:#f5efe0;color:#222;font-family:Georgia,'Times New Roman',serif}
  .wrap{max-width:980px;margin:0 auto;padding:26px 16px 40px}
  h1{font-size:26px;text-align:center;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:bold}
  .sub{text-align:center;font-style:italic;margin:6px 0 14px}
  .rule{border:0;border-top:3px double #222;margin:0}
  .bar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;border:1px solid #222;background:#fbf7ec;padding:14px;margin:22px 0}
  .bar .f{flex:1;min-width:220px}
  .bar label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}
  select{font:inherit;width:100%;padding:9px;border:1px solid #222;background:#fff;color:#222}
  .switch button{font:inherit;background:none;border:1px solid #222;padding:8px 16px;cursor:pointer;color:#222}
  .switch button.on{background:#222;color:#f5efe0}
  .box{position:relative;height:300px;border:1px solid #222;background:#fbf7ec;padding:8px}
  h2{font-size:16px;font-weight:normal;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid #222;margin:28px 0 10px;padding-bottom:4px}
  .msg{text-align:center;font-style:italic;margin:40px 0}
  footer{text-align:center;margin-top:40px;font-size:13px}
  footer a{color:#222}
  .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin:0 0 14px}
  .act span{font-size:14px;font-style:italic;margin-right:auto}
  .act button{font:inherit;background:none;border:1px solid #222;padding:8px 16px;cursor:pointer;color:#222}
  .act button:hover{background:#222;color:#f5efe0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>PYP Educators' Assessment Record</h1>
  <div class="sub">Eastern Public School</div>
  <hr class="rule">

  <div class="bar">
    <div class="f"><label for="teacher">Teacher</label>
      <select id="teacher"><option value="">Select teacher</option></select></div>
    <div class="switch"><button id="bLine" class="on" type="button">Line</button><button id="bBar" type="button">Bar</button></div>
  </div>

  <div id="allAct" class="act" hidden>
    <span>Collected report of all teachers</span>
    <button id="bAllPdf" type="button">Download all (PDF)</button>
    <button id="bAllCsv" type="button">Download all (CSV)</button>
  </div>

  <div id="msg" class="msg">Loading…</div>
  <div id="box" hidden>
    <div class="act">
      <span>Report of this teacher</span>
      <button id="bPdf" type="button">Download report (PDF)</button>
    </div>
    <h2>IB Learner Profiles (IB-LPs)</h2><div class="box"><canvas id="c0"></canvas></div>
    <h2>ISP Learner Profiles (ISP-LPs)</h2><div class="box"><canvas id="c1"></canvas></div>
    <h2>IB Document</h2><div class="box"><canvas id="c2"></canvas></div>
    <h2>Overall Percentage</h2><div class="box"><canvas id="c3"></canvas></div>
  </div>

  <footer><a href="/admin.html">Admin</a></footer>
</div>
<script>
const $ = id => document.getElementById(id);
const CATS = [
  { key: 'ib_lp',  max: 'max_ib_lp',  label: 'IB-LP',       color: '#7a2e2e' },
  { key: 'isp_lp', max: 'max_isp_lp', label: 'ISP-LP',      color: '#2e4a7a' },
  { key: 'ib_doc', max: 'max_ib_doc', label: 'IB Document', color: '#3d6b3d' }
];
let tests = [], marks = [], type = 'line', charts = [];

Chart.defaults.font.family = "Georgia, 'Times New Roman', serif";
Chart.defaults.color = '#222';

const round = x => Math.round(x * 10) / 10;

// pts[i] = { pct, text } or null (not held / not attempted)
function makeChart(canvasId, label, color, list, pts) {
  return new Chart($(canvasId), {
    type,
    data: {
      labels: list.map(t => t.test_id),
      datasets: [{ label, data: pts.map(p => p ? p.pct : null), borderColor: color, backgroundColor: color,
                   borderWidth: 2, tension: 0, spanGaps: true, pointRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: items => { const t = list[items[0].dataIndex]; return `Assessment ${t.test_id} · ${t.date}`; },
          label: ctx => { const p = pts[ctx.dataIndex]; return `${label}: ${p.text} (${p.pct}%)`; }
        } }
      },
      scales: {
        y: { min: 0, max: 100, ticks: { callback: v => v + '%' }, grid: { color: '#e4dcc6' } },
        x: { title: { display: true, text: 'Assessment ID' }, grid: { display: false } }
      }
    }
  });
}

function draw() {
  charts.forEach(c => c.destroy()); charts = [];
  const name = $('teacher').value;
  if (!name) { $('box').hidden = true; $('msg').hidden = false; $('msg').textContent = 'Select a teacher to see the graphs.'; return; }

  const mine = new Map(marks.filter(m => m.teacher === name).map(m => [m.test_id, m]));
  const list = tests.filter(t => mine.has(t.test_id));   // all assessments for this teacher, in date order
  $('msg').hidden = true; $('box').hidden = false;

  // graphs 1-3: one per category
  CATS.forEach((c, k) => {
    // only assessments where at least one teacher has a mark for this category
    const held = new Set(marks.filter(m => m[c.key] != null).map(m => m.test_id));
    const shown = list.filter(t => held.has(t.test_id));
    const pts = shown.map(t => {
      const v = (mine.get(t.test_id) || {})[c.key];
      return v == null ? null : { pct: round(v / t[c.max] * 100), text: `${v} / ${t[c.max]}` };
    });
    charts.push(makeChart('c' + k, c.label, c.color, shown, pts));
  });

  // graph 4: overall % = total marks / total maximum, over the categories attempted in that assessment
  const overall = list.map(t => {
    let got = 0, max = 0;
    CATS.forEach(c => { const v = mine.get(t.test_id)[c.key]; if (v != null) { got += v; max += t[c.max]; } });
    return max ? { pct: round(got / max * 100), text: `${round(got)} / ${round(max)}` } : null;
  });
  charts.push(makeChart('c3', 'Overall', '#5a3a6b', list, overall));
}

/* ---------- reports ---------- */

const allNames = () => [...new Set(marks.map(m => m.teacher))].sort((a, b) => a.localeCompare(b));
const fileSafe = s => s.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');

// one entry per assessment this teacher took part in, with the overall total
function rowsFor(name) {
  const mine = new Map(marks.filter(m => m.teacher === name).map(m => [m.test_id, m]));
  return tests.filter(t => mine.has(t.test_id)).map(t => {
    const m = mine.get(t.test_id);
    let got = 0, max = 0;
    CATS.forEach(c => { const v = m[c.key]; if (v != null && t[c.max]) { got += v; max += t[c.max]; } });
    return { t, m, got, max };
  });
}

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ----- CSV (all teachers) ----- */

const csvCell = v => {
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

function downloadAllCsv() {
  const head = ['Teacher', 'Assessment ID', 'Date'];
  CATS.forEach(c => head.push(`${c.label} marks`, `${c.label} max`, `${c.label} %`));
  head.push('Overall marks', 'Overall max', 'Overall %');
  const rows = [head];
  allNames().forEach(name => {
    rowsFor(name).forEach(({ t, m, got, max }) => {
      const row = [name, t.test_id, t.date];
      CATS.forEach(c => {
        const v = m[c.key];
        if (v == null || !t[c.max]) { row.push('', '', ''); return; }
        row.push(v, t[c.max], round(v / t[c.max] * 100));
      });
      row.push(max ? round(got) : '', max ? round(max) : '', max ? round(got / max * 100) : '');
      rows.push(row);
    });
  });
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  saveBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'all_teachers_report.csv');
}

/* ----- PDF ----- */

const PL = 15, PW = 180;   // left margin and usable width in mm
const PCOLS = [['Assessment', 24], ['Date', 26], ['IB-LP', 32], ['ISP-LP', 32], ['IB Document', 34], ['Overall', 32]];

function startPdf(title) {
  if (!window.jspdf) { alert('PDF library could not load. Please check your internet connection and refresh the page.'); return null; }
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const p = { doc, y: 18 };
  doc.setFont('times', 'bold'); doc.setFontSize(16);
  doc.text("PYP EDUCATORS' ASSESSMENT RECORD", 105, p.y, { align: 'center' });
  p.y += 6; doc.setFont('times', 'italic'); doc.setFontSize(11);
  doc.text('Eastern Public School', 105, p.y, { align: 'center' });
  p.y += 4; doc.setLineWidth(0.5); doc.line(PL, p.y, PL + PW, p.y);
  p.y += 8; doc.setFont('times', 'bold'); doc.setFontSize(13);
  doc.text(title, PL, p.y);
  doc.setFont('times', 'normal'); doc.setFontSize(10);
  doc.text('Generated: ' + new Date().toLocaleDateString('en-GB'), PL + PW, p.y, { align: 'right' });
  p.y += 8;
  return p;
}

function need(p, h) {
  if (p.y + h > 285) { p.doc.addPage(); p.y = 18; }
}

const pdfCell = (v, mx) => (v == null || !mx) ? '-' : `${v}/${mx} (${round(v / mx * 100)}%)`;

function pdfRow(p, cells, bold) {
  need(p, 8);
  p.doc.setFont('times', bold ? 'bold' : 'normal'); p.doc.setFontSize(9);
  let x = PL;
  cells.forEach((c, i) => { p.doc.text(String(c), x, p.y); x += PCOLS[i][1]; });
  p.y += 2; p.doc.setLineWidth(bold ? 0.4 : 0.1); p.doc.line(PL, p.y, PL + PW, p.y);
  p.y += 5;
}

// table of assessments for one teacher
function pdfTable(p, name) {
  pdfRow(p, PCOLS.map(c => c[0]), true);
  rowsFor(name).forEach(({ t, m, got, max }) => {
    pdfRow(p, [
      t.test_id, t.date,
      pdfCell(m.ib_lp, t.max_ib_lp), pdfCell(m.isp_lp, t.max_isp_lp), pdfCell(m.ib_doc, t.max_ib_doc),
      max ? `${round(got)}/${round(max)} (${round(got / max * 100)}%)` : '-'
    ], false);
  });
}

// report of the selected teacher: table + the four graphs
function downloadTeacherPdf() {
  const name = $('teacher').value;
  if (!name) return;
  const p = startPdf('Teacher: ' + name);
  if (!p) return;

  pdfTable(p, name);
  p.y += 4;

  ['IB Learner Profiles (IB-LPs)', 'ISP Learner Profiles (ISP-LPs)', 'IB Document', 'Overall Percentage'].forEach((title, k) => {
    const cv = $('c' + k);
    let w = PW, h = PW * cv.height / cv.width;
    if (h > 80) { h = 80; w = h * cv.width / cv.height; }
    need(p, h + 12);
    p.doc.setFont('times', 'bold'); p.doc.setFontSize(11);
    p.doc.text(title, PL, p.y);
    p.y += 2;
    p.doc.addImage(cv.toDataURL('image/png'), 'PNG', PL + (PW - w) / 2, p.y, w, h);
    p.y += h + 8;
  });

  p.doc.save('report_' + fileSafe(name) + '.pdf');
}

// collected report: every teacher, one table each
function downloadAllPdf() {
  const names = allNames();
  if (!names.length) return;
  const p = startPdf('All teachers (' + names.length + ')');
  if (!p) return;

  names.forEach(name => {
    need(p, 30);
    p.doc.setFont('times', 'bold'); p.doc.setFontSize(12);
    p.doc.text(name, PL, p.y);
    p.y += 5;
    pdfTable(p, name);
    p.y += 6;
  });

  p.doc.save('all_teachers_report.pdf');
}

/* ---------- wiring ---------- */

function setType(t) {
  type = t;
  $('bLine').classList.toggle('on', t === 'line');
  $('bBar').classList.toggle('on', t === 'bar');
  draw();
}
$('bLine').onclick = () => setType('line');
$('bBar').onclick = () => setType('bar');
$('teacher').onchange = draw;
$('bPdf').onclick = downloadTeacherPdf;
$('bAllPdf').onclick = downloadAllPdf;
$('bAllCsv').onclick = downloadAllCsv;

(async () => {
  try {
    const res = await fetch('/.netlify/functions/data');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load marks.');
    tests = data.tests || []; marks = data.marks || [];
    const names = allNames();
    $('teacher').innerHTML = '<option value="">Select teacher</option>' + names.map(n => `<option>${n.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</option>`).join('');
    $('allAct').hidden = !names.length;
    $('msg').textContent = names.length ? 'Select a teacher to see the graphs.' : 'No marks have been entered yet.';
  } catch (e) { $('msg').textContent = e.message; }
})();
</script>
</body>
</html>
